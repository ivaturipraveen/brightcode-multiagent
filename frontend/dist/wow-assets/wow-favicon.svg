<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F0D880"/>
      <stop offset="35%"  stop-color="#D4A843"/>
      <stop offset="75%"  stop-color="#B8892A"/>
      <stop offset="100%" stop-color="#96711C"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E8C96A"/>
      <stop offset="50%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A07828"/>
    </linearGradient>
  </defs>

  <!-- NO background rect — transparent outside the O -->

  <!-- Outer gold ring -->
  <circle cx="50" cy="50" r="45" fill="url(#g1)"/>
  <!-- Gap — transparent cutout -->
  <circle cx="50" cy="50" r="31.4" fill="black"/>
  <!-- Center gold dot -->
  <circle cx="50" cy="50" r="12.6" fill="url(#g2)"/>
</svg>