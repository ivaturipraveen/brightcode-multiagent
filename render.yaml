services:
  - type: web
    name: openclaw-multiagent
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: openclaw-postgres
          property: connectionString

  - type: static
    name: openclaw-multiagent-1
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /equivest
        destination: /equivest.html
      - type: rewrite
        source: /turmeric
        destination: /turmeric.html
      - type: rewrite
        source: /wow
        destination: /wow.html
      - type: rewrite
        source: /wow-investor
        destination: /wow-investor.html
      - type: rewrite
        source: /hr1-guide
        destination: /hr1-guide.html
      - type: rewrite
        source: /competitor-analysis-italy
        destination: /competitor-analysis-italy.html
      # Serve the WoW marketing page (plain HTML) at the root so Chinese browsers
      # on older engines don't have to boot the React ES-module bundle (which they
      # can't run -> blank page). The homepage React route was only an iframe wrapper
      # around wow.html anyway. Internal routes (/admin, /hr, ...) still use the SPA below.
      - type: rewrite
        source: /
        destination: /wow.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://openclaw-multiagent.onrender.com

databases:
  # Previously this dependency existed only in the Render dashboard, which is why
  # a deleted instance broke every backend deploy with nothing in the repo to
  # explain it. NOTE: Render deletes `free` Postgres ~30 days after creation —
  # that is what caused the outage. Move to a paid plan to stop it recurring.
  - name: openclaw-postgres
    databaseName: openclaw
    user: openclaw
    plan: free
