services:
  - type: web
    name: openclaw-multiagent
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: static
    name: openclaw-multiagent-1
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /turmeric
        destination: /turmeric.html
      - type: rewrite
        source: /wow
        destination: /wow.html
      - type: rewrite
        source: /wow-investor
        destination: /wow-investor.html
      - type: rewrite
        source: /competitor-analysis-italy
        destination: /competitor-analysis-italy.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://openclaw-multiagent.onrender.com
