services:
  - type: web
    name: openclaw-multiagent
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Set in the Render dashboard, not here — the Postgres instance predates this
      # blueprint and holds live data, so it must not be provisioned from config.
      # Target: database "openclaw", user "tarta_user", instance
      # dpg-d5tj5n7pm1nc739djf8g (Oregon). Use that instance's EXTERNAL hostname
      # (dpg-...-a.oregon-postgres.render.com) — the bare internal hostname
      # "dpg-...-a" does not resolve from the service and crashes startup.
      - key: DATABASE_URL
        sync: false

  - type: static
    name: openclaw-multiagent-1
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /equivest
        destination: /equivest.html
      - type: rewrite
        source: /turmeric
        destination: /turmeric.html
      - type: rewrite
        source: /wow
        destination: /wow.html
      - type: rewrite
        source: /wow-investor
        destination: /wow-investor.html
      - type: rewrite
        source: /hr1-guide
        destination: /hr1-guide.html
      - type: rewrite
        source: /competitor-analysis-italy
        destination: /competitor-analysis-italy.html
      # Serve the WoW marketing page (plain HTML) at the root so Chinese browsers
      # on older engines don't have to boot the React ES-module bundle (which they
      # can't run -> blank page). The homepage React route was only an iframe wrapper
      # around wow.html anyway. Internal routes (/admin, /hr, ...) still use the SPA below.
      - type: rewrite
        source: /
        destination: /wow.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://openclaw-multiagent.onrender.com

# No `databases:` block on purpose. The Postgres instance already exists outside
# this blueprint and holds live data (21 tables); declaring it here would make a
# blueprint sync provision a second, empty database and repoint the API at it.
